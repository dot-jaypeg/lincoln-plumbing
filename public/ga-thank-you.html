<style>
  :root{
    --steel:#181818;
    --paper:#faf8f3;
    --paper-2:#f1ede2;
    --orange:#f4831f;
    --orange-2:#ffb703;
    --rust:#7a3213;
    --ink:#2a2a2a;
    --sub:#6b6558;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;}
  img{max-width:100%; display:block;}
  h1,h2,h3{font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:.5px; line-height:1.1; margin:0;}
  .eyebrow{font-family:'Barlow Condensed', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:3px; font-size:14px; color:var(--rust);}
  .container{max-width:1300px; margin:0 auto; padding:0 24px;}
  a{color:inherit; text-decoration:none;}
  p{margin:0;}

  .btn{display:inline-flex; align-items:center; gap:10px; font-family:'Barlow Condensed', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; font-size:17px; padding:14px 30px; border-radius:3px; border:none; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
  .btn-primary{background:var(--orange); color:#111; box-shadow:0 4px 0 var(--rust);}
  .btn-primary:hover{transform:translateY(2px); box-shadow:0 2px 0 var(--rust);}
  .btn-secondary{background:transparent; color:#fff; border:2px solid #fff; padding:12px 28px; transition:background .15s ease, color .15s ease;}
  .btn-secondary:hover{background:#fff; color:var(--steel);}

  .confirm-hero{
    background:linear-gradient(180deg, var(--steel) 0%, #202020 100%);
    color:#fff; padding:80px 0 90px; position:relative; overflow:hidden; text-align:center;
    min-height:100vh; display:flex; align-items:center;
  }
  .confirm-hero::after{
    content:''; position:absolute; left:50%; top:-160px; width:640px; height:640px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(244,131,31,.16) 0%, rgba(244,131,31,0) 70%);
  }
  .confirm-inner{position:relative; z-index:1; max-width:680px; margin:0 auto;}
  .checkmark{
    width:84px; height:84px; border-radius:50%; background:var(--orange); color:#111;
    display:flex; align-items:center; justify-content:center; margin:0 auto 26px;
    box-shadow:0 10px 30px rgba(244,131,31,.35);
  }
  .confirm-hero h1{font-size:clamp(34px, 5vw, 52px); color:#fff; margin-top:14px;}
  .confirm-hero h1 .hl{color:var(--orange-2);}
  .confirm-hero p.lede{font-size:18px; line-height:1.65; color:#d8d4c8; margin:20px auto 0; max-width:560px;}
  .confirm-ctas{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:32px;}

  @media (max-width: 480px){
    .confirm-ctas{flex-direction:column; align-items:stretch;}
  }
</style>
